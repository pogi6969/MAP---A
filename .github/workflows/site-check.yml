name: Site check
on:
  push:
    paths: [".github/workflows/site-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages || true
      - name: Clear a leftover custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cname=$(gh api repos/${{ github.repository }}/pages --jq '.cname // ""' || true)
          echo "custom domain now: [$cname]"
          if [ -n "$cname" ]; then
            echo '{"cname":null}' | gh api -X PUT repos/${{ github.repository }}/pages --input - && echo "cleared" || echo "could not clear"
            gh api repos/${{ github.repository }}/pages --jq '"custom domain after: [" + (.cname // "") + "]"' || true
          fi
      - name: Fetch the site
        run: |
          for u in https://pogi6969.github.io/MAP---A/ https://pogi6969.github.io/MAP---A/app/ https://pogi6969.github.io/MAP---A/manifest.webmanifest https://pogi6969.github.io/MAP---A/sw.js https://pogi6969.github.io/MAP---A/icons/icon-512.png; do
            curl -sS -o /dev/null -w "%{http_code} redirect=[%{redirect_url}] bytes=%{size_download} $u\n" "$u" || true
          done
          echo "site title: $(curl -sS https://pogi6969.github.io/MAP---A/ | grep -o '<title>[^<]*</title>' | head -1)"
          echo "app title:  $(curl -sS https://pogi6069.github.io/MAP---A/app/ 2>/dev/null | head -c 0)$(curl -sS https://pogi6969.github.io/MAP---A/app/ | grep -o '<title>[^<]*</title>' | head -1)"
      - name: Domains that were tried
        run: |
          for d in map-a.com map-asis.com mapa-asis.com deasis-maps.com deasis-albay-maps.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://rdap.verisign.com/com/v1/domain/$d)
            ns=$(dig +short NS $d | tr '\n' ' ')
            www=$(dig +short www.$d | tr '\n' ' ')
            echo "$d registry=$code (200 registered, 404 not registered) ns=[$ns] www=[$www]"
          done
