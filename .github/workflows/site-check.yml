name: Site check
on:
  push:
    paths: [".github/workflows/site-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Pages deploy
        run: sleep 150
      - name: Check the live website and app
        run: |
          for u in "https://pogi6969.github.io/MAP---A/" "https://pogi6969.github.io/MAP---A/app/" "https://pogi6969.github.io/MAP---A/sw.js"; do
            echo "=== $u"
            curl -sS -D headers.txt -o body.html "$u?check=$GITHUB_RUN_ID"
            grep -iE '^(HTTP|cache-control|age|last-modified|x-cache|etag)' headers.txt
            echo "people-lead: $(grep -c 'people-lead' body.html)"
            echo "leader text: $(grep -o 'Leader and founder of MAP-A and the research' body.html | head -1)"
            echo "lead name: $(grep -o '<span class=\"lead-name\">[^<]*' body.html | head -1)"
            echo "old list: $(grep -c 'Peter John A. Brimbuela, Dave Justin' body.html)"
            echo "APP_LOGO: $(grep -c 'const APP_LOGO=' body.html)"
            echo "sw version: $(grep -o 'map-a-v[0-9]*' body.html | head -1)"
          done
