name: Store apps
on:
  push:
    branches: [main]
    paths: ["native/**", "app/index.html", ".github/workflows/store-apps.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.MAPA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "MAPA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_ANDROID_BANNER_ID }}
          MAPA_KEYSTORE_PASSWORD: ${{ secrets.MAPA_KEYSTORE_PASSWORD }}
          MAPA_KEY_ALIAS: ${{ secrets.MAPA_KEY_ALIAS }}
          MAPA_KEY_PASSWORD: ${{ secrets.MAPA_KEY_PASSWORD }}
        run: |
          [ -n "$ADMOB_APP_ID" ] || unset ADMOB_APP_ID
          [ -n "$ADMOB_BANNER_ID" ] || unset ADMOB_BANNER_ID
          gradle -p native/android --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MAP-A-android
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd native/ios && xcodegen generate
      - name: Build for the simulator
        run: |
          cd native/ios
          xcodebuild -project MAPA.xcodeproj -scheme MAPA -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: MAP-A-ios-simulator
          path: native/ios/build/Build/Products/Release-iphonesimulator/MAPA.app
