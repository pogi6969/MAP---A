# Creality K1C 0.4 nozzle / Hyper PLA / 0.20mm Standard
# Creality K1C profile from the RippleBenchy project; lightning infill, no supports, no ironing

# ---- printer ----
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
gcode_flavor = klipper
use_relative_e_distances = 1
autoemit_temperature_commands = 0
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.4
retract_lift_above = 0
retract_lift_below = 249
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
retract_before_wipe = 70%
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 20000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 20000
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_acceleration_z = 300
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 600
machine_max_feedrate_y = 600
machine_max_feedrate_z = 10
machine_max_feedrate_e = 100
machine_max_jerk_x = 20
machine_max_jerk_y = 20
machine_max_jerk_z = 5
machine_max_jerk_e = 10
remaining_times = 1
thumbnails = 96x96/PNG, 300x300/PNG
start_gcode = START_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]\nT0\nM204 S2000\nM104 S[first_layer_temperature]\nG1 Z3 F600\nM83\nG92 E0\nG1 Z1 F600
end_gcode = M106 P2 S0\nEND_PRINT
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nG92 E0\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]\n{if layer_num == 1}M106 P2 S204\n{endif}
start_filament_gcode = ;filament start gcode\nM104 S[first_layer_temperature]
end_filament_gcode = ;filament end gcode

# ---- filament: Hyper PLA ----
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
extrusion_multiplier = 0.95
filament_max_volumetric_speed = 23
first_layer_temperature = 220
temperature = 220
first_layer_bed_temperature = 50
bed_temperature = 50
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 0
fan_below_layer_time = 100
slowdown_below_layer_time = 10
min_print_speed = 20
enable_dynamic_fan_speeds = 0

# ---- print: 0.20mm Standard ----
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
top_solid_min_thickness = 0.8
bottom_solid_min_thickness = 0
fill_angle = 45
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
infill_anchor = 400%
infill_anchor_max = 20
infill_overlap = 30%
perimeter_generator = arachne
min_bead_width = 85%
min_feature_size = 25%
wall_transition_angle = 10
wall_transition_filter_deviation = 25%
wall_transition_length = 100%
wall_distribution_count = 1
external_perimeters_first = 0
seam_position = aligned
thin_walls = 0
extrusion_width = 0.42
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.42
top_infill_extrusion_width = 0.42
support_material_extrusion_width = 0.42
elefant_foot_compensation = 0.15
xy_size_compensation = 0
overhangs = 1
enable_dynamic_overhang_speeds = 1
overhang_speed_0 = 10
overhang_speed_1 = 10
overhang_speed_2 = 25
overhang_speed_3 = 50
bridge_flow_ratio = 0.9
thick_bridges = 0
ironing_type = top
ironing_flowrate = 10%
ironing_spacing = 0.15
ironing_speed = 30
perimeter_speed = 250
external_perimeter_speed = 200
small_perimeter_speed = 200
infill_speed = 270
solid_infill_speed = 250
top_solid_infill_speed = 200
gap_fill_speed = 250
bridge_speed = 25
travel_speed = 500
first_layer_speed = 60
support_material_speed = 150
support_material_interface_speed = 80
default_acceleration = 10000
perimeter_acceleration = 3000
external_perimeter_acceleration = 3000
infill_acceleration = 10000
solid_infill_acceleration = 10000
top_solid_infill_acceleration = 2000
bridge_acceleration = 5000
first_layer_acceleration = 1000
travel_acceleration = 10000
skirts = 0
brim_width = 4
support_material_auto = 1
support_material_style = organic
support_material_threshold = 30
support_material_buildplate_only = 0
dont_support_bridges = 0
support_material_contact_distance = 0.2
support_material_bottom_contact_distance = 0.2
support_material_xy_spacing = 0.35
support_material_interface_layers = 2
support_material_bottom_interface_layers = 2
support_material_interface_spacing = 0.5
support_material_spacing = 2.5
support_material_pattern = rectilinear
support_material_interface_pattern = rectilinear
support_tree_angle = 40
support_tree_angle_slow = 25
support_tree_branch_diameter = 2
support_tree_branch_diameter_angle = 5
support_tree_branch_diameter_double_wall = 3
support_tree_tip_diameter = 0.8
support_tree_branch_distance = 1
support_tree_top_rate = 30%
raft_layers = 0
complete_objects = 0
arc_fitting = emit_center
gcode_resolution = 0.012
gcode_comments = 0
gcode_label_objects = firmware
avoid_crossing_perimeters = 0
only_retract_when_crossing_perimeters = 1
infill_first = 0
interface_shells = 0
support_material = 0
ironing = 0
fill_pattern = lightning
fill_density = 10%
