# PrusaSlicer settings used for tower.gcode
# Printer: Marlin, 220x220 bed (Ender-3 class), 0.4 mm nozzle
# Filament: PLA 1.75 mm, 210/205 C nozzle, 60 C bed

# ---- printer ----
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
retract_length = 5
retract_speed = 45
deretract_speed = 0
retract_lift = 0.2
retract_before_travel = 2
retract_layer_change = 1
wipe = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 500
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 500
machine_max_acceleration_x = 500
machine_max_acceleration_y = 500
machine_max_acceleration_z = 100
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 10
machine_max_feedrate_e = 60
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
machine_max_jerk_e = 5
remaining_times = 1
layer_gcode = G92 E0
thumbnails =
start_gcode = G90 ; absolute coordinates\nM83 ; relative extrusion\nM107 ; fan off\nM140 S[first_layer_bed_temperature] ; heat bed\nM104 S150 ; warm nozzle (no ooze)\nM190 S[first_layer_bed_temperature] ; wait for bed\nG28 ; home all axes\nM420 S1 ; use stored bed mesh if the printer has one\nG1 Z5 F600\nG1 X2 Y20 F3000\nM109 S[first_layer_temperature] ; wait for nozzle\nG92 E0\nG1 Z0.28 F600\nG1 Y140 E10 F1500 ; prime line\nG1 X2.4 F5000\nG1 Y20 E10 F1200 ; prime line\nG92 E0\nG1 Z2 F600
end_gcode = G1 E-2 F2700 ; retract\nG91\nG1 Z10 F600 ; lift nozzle\nG90\nG1 X5 Y200 F3000 ; present print\nM104 S0 ; nozzle off\nM140 S0 ; bed off\nM107 ; fan off\nM84 X Y E ; motors off

# ---- filament ----
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
extrusion_multiplier = 1
first_layer_temperature = 210
temperature = 205
first_layer_bed_temperature = 60
bed_temperature = 60
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 3
fan_below_layer_time = 60
slowdown_below_layer_time = 10
min_print_speed = 8

# ---- print ----
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
perimeter_generator = arachne
seam_position = rear
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
skirts = 2
skirt_distance = 5
skirt_height = 1
brim_width = 0
support_material = 0
overhangs = 1
perimeter_speed = 40
external_perimeter_speed = 25
small_perimeter_speed = 15
infill_speed = 60
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 25
bridge_speed = 25
travel_speed = 150
first_layer_speed = 20
avoid_crossing_perimeters = 0
gcode_comments = 0
gcode_label_objects = octoprint
z_offset = 0
