top_infill_extrusion_width = 0.4
perimeter_speed = 50
small_perimeter_speed = 50%
external_perimeter_speed = 35
infill_speed = 60
solid_infill_speed = 55
top_solid_infill_speed = 30
gap_fill_speed = 30
bridge_speed = 25
travel_speed = 150
first_layer_speed = 25
support_material = 0
skirts = 0
brim_width = 0
gcode_comments = 0
gcode_label_objects = firmware
output_filename_format = {input_filename_base}_PETG_{print_time}.gcode
