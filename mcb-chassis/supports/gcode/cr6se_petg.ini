# PrusaSlicer profile copied from your OrcaSlicer CR-6 SE / FILANEX PETG G-code (3dbenchy_2_PETG)
bed_shape = 5x0,240x0,240x235,5x235
max_print_height = 250
printer_model =
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
machine_limits_usage = emit_to_gcode
machine_max_acceleration_x = 2000
machine_max_acceleration_y = 2000
machine_max_acceleration_z = 2000
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 2000
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 2000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 500
machine_max_feedrate_e = 60
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
machine_max_jerk_e = 5
default_acceleration = 1500
first_layer_acceleration = 1500
external_perimeter_acceleration = 1500
travel_acceleration = 1700
start_gcode = ; CR-6 SE Community Firmware\nM201 X500 Y500 Z100 E5000\nM203 X500 Y500 Z10 E50\nM204 P500 R1000 T500\n\nM220 S100\nM221 S100\n\nG90\nM82\n\nM140 S[first_layer_bed_temperature]\nM104 S150\n\nM190 S[first_layer_bed_temperature]\n\nG28\nM420 S1\n\nG1 Z10 F600\n\nM109 S[first_layer_temperature]\n\nG92 E0\n\nG1 X2.1 Y20 F5000\nG1 Z0.28 F600\nG1 X2.1 Y200 Z0.28 F1500 E15\nG1 X2.4 Y200 Z0.28 F5000\nG1 X2.4 Y20 Z0.28 F1500 E30\n\nG92 E0\nG1 Z2 F3000\nM83 ; use relative distances for extrusion
end_gcode = ; CR-6 SE Community Firmware\n\nM400\nG92 E0\nG1 E-2 F2700\n\nG91\nG1 Z10 F600\nG90\n\nG1 X0 Y200 F3000\n\nM106 S0\nM104 S0\nM140 S0\n\nM84 X Y E
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nG92 E0\n
layer_gcode =
# filament: FILANEX PETG
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 380
extrusion_multiplier = 0.95
filament_max_volumetric_speed = 11
temperature = 215
first_layer_temperature = 220
bed_temperature = 75
first_layer_bed_temperature = 75
retract_length = 3.5
retract_speed = 80
retract_restart_extra = 0.5
retract_before_travel = 1
retract_layer_change = 1
retract_lift = 0.2
retract_lift_above = 0
wipe = 1
retract_before_wipe = 70%
cooling = 1
fan_always_on = 1
min_fan_speed = 20
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 3
fan_below_layer_time = 15
slowdown_below_layer_time = 5
# print: 0.20mm Standard
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
perimeter_generator = arachne
seam_position = aligned
extrusion_width = 0.4
