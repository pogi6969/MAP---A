name: MAPA
options:
  bundleIdPrefix: ph.mapa
  deploymentTarget:
    iOS: "15.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "13.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"
targets:
  MAPA:
    type: application
    platform: iOS
    sources:
      - path: MAPA
      - path: ../../app/index.html
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: MAPA/Info.plist
      properties:
        CFBundleDisplayName: MAP-A
        CFBundleShortVersionString: "49"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ADMOBBannerID: $(ADMOB_BANNER_ID)
        NSLocationWhenInUseUsageDescription: MAP-A uses your location only to centre the map and plan trips from where you are. It is not stored or sent anywhere.
        NSUserTrackingUsageDescription: This lets the free version of MAP-A show ads that are more relevant to you. MAP-A itself does not track you.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ph.mapa.albay
        PRODUCT_NAME: MAPA
        MARKETING_VERSION: "49"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        # Google's published test IDs; the release build overrides these with the IDs from your AdMob account.
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_BANNER_ID: ca-app-pub-3940256099942544/2435281174
