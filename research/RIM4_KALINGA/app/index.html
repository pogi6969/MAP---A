<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KALINGA Monitor</title>
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#1f2a44;--bg:#f4f6fa;--card:#fff;--mut:#6b7280;--line:#e5e7eb;--g:#1e9e5a;--y:#d49b00;--r:#d33a2c;--acc:#c0392b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}.dot{width:10px;height:10px;border-radius:50%;background:#888;display:inline-block}
.dot.on{background:#3ddc84}main{padding:14px 16px 90px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{border-radius:12px;padding:10px;background:var(--bg);text-align:center}
.tile b{display:block;font-size:22px}.tile small{color:var(--mut)}
.lvl{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:600;font-size:12px}
.GREEN,.taken{background:var(--g)}.YELLOW,.late{background:var(--y)}.RED,.missed{background:var(--r)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .grow{flex:1}.mut{color:var(--mut);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}button.red{background:var(--acc)}
.btns{display:flex;gap:8px;flex-wrap:wrap}input,select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 4px;font-size:12px}nav button.on{color:var(--ink);font-weight:700}
.banner{background:#fdecea;border:1px solid #f5c6c0;color:var(--acc);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.slot{display:grid;grid-template-columns:80px 1fr 56px;gap:8px;align-items:center;margin-bottom:8px}
svg{width:100%;height:120px}.toast{position:fixed;left:16px;right:16px;bottom:80px;background:var(--acc);color:#fff;padding:12px;border-radius:12px;display:none;z-index:9}
.hide{display:none}
</style>
</head>
<body>
<header><span id="dot" class="dot"></span><h1 id="title">KALINGA Monitor</h1><span id="batt" class="mut" style="color:#cbd5e1"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast" class="toast"></div>
<script>
const $ = s => document.querySelector(s);
const TABS = [["home","Home"],["vitals","Vitals"],["meds","Medicine"],["alerts","Alerts"],["settings","Settings"]];
let tab = "home", S = {}, cfg = {}, token = null, refresh = null, es = null, demo = false, seenAlerts = null;
try { cfg = JSON.parse(localStorage.getItem("kalinga.cfg") || "{}"); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem("kalinga.cfg", JSON.stringify(cfg)); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = ts => ts ? new Date(ts).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
const list = o => Object.entries(o || {}).map(([id, v]) => ({id, ...v})).sort((a, b) => (b.ts || 0) - (a.ts || 0));

// ---------- Firebase REST ----------
async function signIn(email, pass) {
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${cfg.apiKey}`,
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email, password:pass, returnSecureToken:true})});
  const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || "Sign-in failed");
  token = j.idToken; refresh = j.refreshToken; cfg.refresh = refresh; saveCfg(); startStream();
}
async function renew() {
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${cfg.apiKey}`,
    {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:`grant_type=refresh_token&refresh_token=${cfg.refresh}`});
  const j = await r.json(); if (!r.ok) throw new Error("Session expired");
  token = j.id_token; cfg.refresh = j.refresh_token; saveCfg();
}
const base = () => `${cfg.dbUrl.replace(/\/$/, "")}/patients/${encodeURIComponent(cfg.patient)}`;
async function write(method, path, body) {
  if (demo) { demoWrite(method, path, body); return; }
  const r = await fetch(`${base()}${path}.json?auth=${token}`, {method, body: JSON.stringify(body)});
  if (!r.ok) toast("Could not save. Check your connection.");
}
function setPath(obj, path, val) {
  const keys = path.split("/").filter(Boolean);
  if (!keys.length) return val ?? {};
  let o = obj; keys.slice(0, -1).forEach(k => o = (o[k] = (o[k] && typeof o[k] === "object") ? o[k] : {}));
  const last = keys.at(-1); if (val === null) delete o[last]; else o[last] = val; return obj;
}
function startStream() {
  if (es) es.close();
  es = new EventSource(`${base()}.json?auth=${token}`);
  es.addEventListener("put", e => { const {path, data} = JSON.parse(e.data); S = setPath(S, path, data); changed(); });
  es.addEventListener("patch", e => { const {path, data} = JSON.parse(e.data);
    Object.entries(data || {}).forEach(([k, v]) => S = setPath(S, `${path}/${k}`, v)); changed(); });
  es.addEventListener("auth_revoked", async () => { await renew(); startStream(); });
  es.onerror = () => setTimeout(async () => { try { await renew(); startStream(); } catch (e) {} }, 5000);
}
setInterval(async () => { if (token && !demo) { try { await renew(); startStream(); } catch (e) {} } }, 50 * 60 * 1000);

// ---------- Demo data ----------
function demoData() {
  const now = Date.now(), H = 3600e3, v = {}, d = {}, a = {};
  for (let i = 0; i < 14; i++) v["v" + i] = {ts: now - i * 12 * H, temp: +(36.4 + Math.random() * .6).toFixed(1),
    hr: 68 + Math.round(Math.random() * 14), spo2: 95 + Math.round(Math.random() * 3), level: "GREEN", source: "schedule"};
  v.v3.temp = 37.8; v.v3.level = "YELLOW";
  ["taken","taken","late","taken","missed","taken","taken","taken"].forEach((s, i) =>
    d["d" + i] = {ts: now - i * 6 * H, slot: i % 4 + 1, label: ["Losartan 50 mg","Metformin 500 mg","Metformin 500 mg","Vitamin B"][i % 4], status: s});
  a.a1 = {ts: now - 26 * H, type: "MISSED_DOSE", msg: "Missed Metformin 500 mg due 18:00.", ack: true};
  return {profile:{name:"Lola Nena (demo)"}, status:{ts: now - 60e3, battery: 78, rssi: -58, queued: 0},
    latest: {...v.v0}, vitals: v, doses: d, alerts: a, settings:{checkHours:[8,18], inactivityHours:3},
    schedule:{1:{time:"07:00",label:"Losartan 50 mg",enabled:true},2:{time:"12:00",label:"Metformin 500 mg",enabled:true},
      3:{time:"18:00",label:"Metformin 500 mg",enabled:true},4:{time:"21:00",label:"Vitamin B",enabled:false}}};
}
function demoWrite(method, path, body) {
  if (path === "/commands") {
    if (body.ring) toast("Demo: the pendant would ring now.");
    if (body.check) setTimeout(() => { const r = {ts: Date.now(), temp: 36.7, hr: 74, spo2: 97, level: "GREEN", source: "app"};
      S.latest = r; S.vitals["v" + Date.now()] = r; changed(); toast("Demo: new check received."); }, 2500);
    return;
  }
  if (method === "PATCH") Object.entries(body).forEach(([k, val]) => setPath(S, `${path}/${k}`, val));
  else setPath(S, path, body);
  changed();
}
function demoFall() { S.alerts["x" + Date.now()] = {ts: Date.now(), type: "FALL", msg: "Possible fall, peak 3.1 g, no answer in 10 s.", ack: false}; changed(); }

// ---------- Rendering ----------
function changed() {
  const al = list(S.alerts).filter(x => !x.ack);
  if (seenAlerts) al.filter(x => !seenAlerts.has(x.id)).forEach(notify);
  seenAlerts = new Set(list(S.alerts).map(x => x.id));
  render();
}
function notify(a) {
  const msg = `${label(a.type)}: ${a.msg}`; toast(msg); navigator.vibrate?.([300, 100, 300]);
  if ("Notification" in window && Notification.permission === "granted") new Notification("KALINGA alert", {body: msg, icon: "icon-192.png"});
}
const label = t => ({FALL:"🚨 Fall",SOS:"🚨 SOS",MISSED_DOSE:"💊 Missed dose",VITALS_RED:"❤️ Abnormal check",INACTIVE:"⏸ No movement",LOW_BATTERY:"🔋 Low battery"}[t] || t);
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 5000); }
function chart(rows, key, lo, hi, color) {
  const pts = rows.slice(0, 14).reverse().filter(r => r[key] > 0); if (pts.length < 2) return "<p class=mut>Not enough readings yet.</p>";
  const W = 300, Hh = 110, x = i => 10 + i * (W - 20) / (pts.length - 1), y = v => Hh - 10 - (v - lo) / (hi - lo) * (Hh - 20);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${key} trend"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>` +
    pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[key])}" r="3" fill="${color}"><title>${fmt(p.ts)}: ${p[key]}</title></circle>`).join("") +
    `<text x="4" y="12" font-size="10" fill="#6b7280">${hi}</text><text x="4" y="${Hh - 2}" font-size="10" fill="#6b7280">${lo}</text></svg>`;
}
function render() {
  const online = S.status?.ts && Date.now() - S.status.ts < 20 * 60e3;
  $("#dot").className = "dot" + (online ? " on" : ""); $("#title").textContent = S.profile?.name || "KALINGA Monitor";
  $("#batt").textContent = S.status?.battery != null ? `🔋${S.status.battery}%` : "";
  $("#nav").innerHTML = TABS.map(([k, t]) => `<button class="${k === tab ? "on" : ""}" onclick="go('${k}')">${t}</button>`).join("");
  if (!token && !demo) return renderLogin();
  const L = S.latest || {}, al = list(S.alerts).filter(a => !a.ack), doses = list(S.doses), vit = list(S.vitals);
  const sched = Object.entries(S.schedule || {}).map(([k, v]) => ({slot: k, ...v})).filter(s => s.enabled).sort((a, b) => a.time.localeCompare(b.time));
  const hm = new Date().toTimeString().slice(0, 5), next = sched.find(s => s.time > hm) || sched[0];
  const week = doses.filter(d => d.ts > Date.now() - 7 * 86400e3), adh = week.length ? Math.round(100 * week.filter(d => d.status !== "missed").length / week.length) : null;
  let h = "";
  if (tab === "home") {
    if (al.length) h += `<div class="banner" onclick="go('alerts')">${al.length} new alert${al.length > 1 ? "s" : ""}: ${esc(label(al[0].type))} — tap to view</div>`;
    h += `<div class="card"><h2>Pendant</h2><div class="row"><div class="grow"><b>${online ? "Online" : "Offline"}</b><div class="mut">Last seen ${fmt(S.status?.ts)}</div></div><div>${S.status?.battery ?? "—"}% battery</div></div></div>`;
    h += `<div class="card"><h2>Latest check <span class="lvl ${L.level || ""}">${L.level || "—"}</span></h2><div class="tiles">
      <div class="tile"><b>${L.temp || "—"}</b><small>°C</small></div><div class="tile"><b>${L.hr > 0 ? L.hr : "—"}</b><small>bpm</small></div>
      <div class="tile"><b>${L.spo2 > 0 ? L.spo2 : "—"}</b><small>% SpO₂</small></div></div><p class="mut">${fmt(L.ts)}</p>
      <div class="btns"><button onclick="cmd('check')">Check now</button><button class="ghost" onclick="cmd('ring')">Ring pendant</button></div></div>`;
    h += `<div class="card"><h2>Medicine</h2><div class="row"><div class="grow">Next: <b>${next ? esc(next.label) : "none set"}</b></div><div>${next ? next.time : ""}</div></div>
      <div class="row"><div class="grow">Doses on time or late, last 7 days</div><b>${adh == null ? "—" : adh + "%"}</b></div></div>`;
    if (demo) h += `<div class="card"><h2>Demo</h2><button class="red" onclick="demoFall()">Simulate a fall alert</button></div>`;
  }
  if (tab === "vitals") {
    h += `<div class="card"><h2>Pulse rate (bpm)</h2>${chart(vit, "hr", 40, 140, "#c0392b")}</div>
      <div class="card"><h2>SpO₂ (%)</h2>${chart(vit, "spo2", 85, 100, "#1f6feb")}</div>
      <div class="card"><h2>Temperature (°C)</h2>${chart(vit, "temp", 35, 40, "#d49b00")}</div><div class="card"><h2>All checks</h2>` +
      vit.slice(0, 30).map(v => `<div class="row"><div class="grow">${fmt(v.ts)}<div class="mut">${esc(v.source || "")}</div></div><div>${v.temp || "—"} °C · ${v.hr > 0 ? v.hr : "—"} · ${v.spo2 > 0 ? v.spo2 + "%" : "—"}</div><span class="lvl ${v.level}">${v.level}</span></div>`).join("") + "</div>";
  }
  if (tab === "meds") {
    h += `<div class="card"><h2>Pill carousel schedule</h2><p class="mut">Fill each slot of the pendant every morning. The pendant opens the slot at its time.</p>` +
      [1, 2, 3, 4].map(k => { const s = S.schedule?.[k] || {}; return `<div class="slot"><input type="time" id="t${k}" value="${s.time || ""}" aria-label="Slot ${k} time">
        <input id="l${k}" value="${esc(s.label || "")}" placeholder="Slot ${k}: medicine and dose" aria-label="Slot ${k} medicine">
        <select id="e${k}" aria-label="Slot ${k} on or off"><option value="1" ${s.enabled ? "selected" : ""}>On</option><option value="0" ${s.enabled ? "" : "selected"}>Off</option></select></div>`; }).join("") +
      `<button onclick="saveSchedule()">Save schedule</button></div><div class="card"><h2>Dose log</h2>` +
      (doses.length ? doses.slice(0, 30).map(d => `<div class="row"><div class="grow">${esc(d.label)}<div class="mut">Slot ${d.slot} · ${fmt(d.ts)}</div></div><span class="lvl ${d.status}">${d.status}</span></div>`).join("") : "<p class=mut>No doses yet.</p>") + "</div>";
  }
  if (tab === "alerts") {
    h += `<div class="card"><h2>Alerts</h2>` + (list(S.alerts).length ? list(S.alerts).slice(0, 40).map(a => `<div class="row"><div class="grow"><b>${esc(label(a.type))}</b><div>${esc(a.msg)}</div><div class="mut">${fmt(a.ts)}</div></div>${a.ack ? '<span class="mut">Seen</span>' : `<button class="ghost" onclick="ack('${a.id}')">Seen</button>`}</div>`).join("") : "<p class=mut>No alerts.</p>") + "</div>";
  }
  if (tab === "settings") h += settingsHtml();
  $("#main").innerHTML = h;
}
function settingsHtml() {
  const st = S.settings || {};
  return `<div class="card"><h2>Checks and alerts</h2><label>Daily check hours (24 h)</label><div class="btns"><input id="c1" type="number" min="0" max="23" value="${st.checkHours?.[0] ?? 8}" style="width:90px"><input id="c2" type="number" min="0" max="23" value="${st.checkHours?.[1] ?? 18}" style="width:90px"></div>
    <label>Alert if no movement for (hours, 7:00–21:00)</label><input id="ina" type="number" min="1" max="12" value="${st.inactivityHours ?? 3}">
    <label>Patient name</label><input id="pname" value="${esc(S.profile?.name || "")}"><p></p><button onclick="saveSettings()">Save</button></div>
    <div class="card"><h2>Notifications</h2><button class="ghost" onclick="Notification.requestPermission().then(()=>toast('Notification setting: '+Notification.permission))">Allow alerts on this phone</button>
    <p class="mut">Alerts appear while the app is open or running in the background.</p></div>
    <div class="card"><h2>Account</h2><p class="mut">${demo ? "Demo mode" : "Signed in · patient " + esc(cfg.patient)}</p><button class="ghost" onclick="logout()">Sign out</button></div>`;
}
function renderLogin() {
  $("#nav").innerHTML = "";
  $("#main").innerHTML = `<div class="card"><h2>Sign in</h2><label>Firebase Web API key</label><input id="k" value="${esc(cfg.apiKey || "")}">
    <label>Realtime Database URL</label><input id="u" value="${esc(cfg.dbUrl || "")}" placeholder="https://your-project-default-rtdb.asia-southeast1.firebasedatabase.app">
    <label>Patient id</label><input id="p" value="${esc(cfg.patient || "lola1")}"><label>Email</label><input id="e" type="email" autocomplete="username">
    <label>Password</label><input id="w" type="password" autocomplete="current-password"><p></p>
    <div class="btns"><button onclick="login()">Sign in</button><button class="ghost" onclick="startDemo()">Try the demo</button></div><p id="err" class="mut"></p></div>`;
}
window.go = k => { tab = k; render(); };
window.cmd = k => { write("PATCH", "/commands", {[k]: Date.now()}); if (!demo) toast(k === "check" ? "Check requested. The pendant asks within a minute." : "The pendant will ring within a minute."); };
window.ack = id => write("PATCH", `/alerts/${id}`, {ack: true});
window.saveSchedule = () => { const s = {}; [1, 2, 3, 4].forEach(k => s[k] = {time: $("#t" + k).value, label: $("#l" + k).value.trim() || `Slot ${k}`, enabled: $("#e" + k).value === "1" && !!$("#t" + k).value});
  write("PUT", "/schedule", s); toast("Schedule saved. The pendant updates within a minute."); };
window.saveSettings = () => { write("PATCH", "/settings", {checkHours: [+$("#c1").value, +$("#c2").value], inactivityHours: +$("#ina").value});
  write("PATCH", "/profile", {name: $("#pname").value.trim()}); toast("Saved."); };
window.login = async () => { cfg.apiKey = $("#k").value.trim(); cfg.dbUrl = $("#u").value.trim(); cfg.patient = $("#p").value.trim(); saveCfg();
  try { await signIn($("#e").value.trim(), $("#w").value); render(); } catch (e) { $("#err").textContent = e.message; } };
window.startDemo = () => { demo = true; S = demoData(); seenAlerts = new Set(list(S.alerts).map(a => a.id)); render(); };
window.logout = () => { es?.close(); token = null; demo = false; S = {}; delete cfg.refresh; saveCfg(); render(); };
window.demoFall = demoFall;
setInterval(() => (token || demo) && render(), 60e3);
(async () => { if (cfg.refresh && cfg.apiKey) { try { await renew(); startStream(); } catch (e) {} } render(); })();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
